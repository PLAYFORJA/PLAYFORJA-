<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080809"><title>Crear cuenta — PLAYFORJA</title><link rel="stylesheet" href="./assets/playforja.css"><style>.signup{width:min(620px,calc(100% - 28px));margin:48px auto}.signup .tile{padding:26px}.signup label{display:block;margin:14px 0 6px;color:#e8d5b0}.signup input,.signup select{width:100%;padding:13px;border-radius:8px;border:1px solid #665334;background:#0b0b0d;color:#fff}.signup h1{font:900 48px 'Barlow Condensed';color:#f3cf78}.signup .status{padding:12px;margin:12px 0;border-radius:8px;background:#211d17;color:#f5d58c;display:none}.signup .status.show{display:block}.signup .btn{margin-top:18px;width:100%}</style></head><body><div class="shell"><header class="topbar"><a class="brand" href="./"><span>⚒</span><span>PLAYFORJA</span></a><nav class="nav"><a href="./">Volver al inicio</a></nav></header><main class="signup"><div class="tile"><h1>CREÁ TU CUENTA</h1><p>Sumate a la comunidad y empezá a forjar tu leyenda.</p><div id="status" class="status" role="status"></div><form id="signupForm"><label for="username">Nombre de jugador</label><input id="username" name="username" minlength="3" maxlength="24" required autocomplete="username" placeholder="Tu nombre en PLAYFORJA"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="vos@ejemplo.com"><label for="password">Contraseña (mínimo 8 caracteres)</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"><label for="country">País</label><select id="country"><option value="">Seleccioná tu país</option><option value="AR">Argentina</option><option value="BO">Bolivia</option><option value="BR">Brasil</option><option value="CL">Chile</option><option value="CO">Colombia</option><option value="MX">México</option><option value="PY">Paraguay</option><option value="PE">Perú</option><option value="UY">Uruguay</option><option value="VE">Venezuela</option></select><button class="btn btn-gold" type="submit">Crear mi cuenta</button></form><p class="muted">Al registrarte aceptás nuestras <a href="politicas.html">políticas</a>.</p></div></main><footer class="footer"><span>© 2026 PLAYFORJA</span><a href="./">Volver al inicio</a></footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="./assets/playforja-backend.js"></script><script>
document.getElementById("signupForm").addEventListener("submit",async e=>{e.preventDefault();const status=document.getElementById("status"),button=e.submitter;status.className="status show";status.textContent="Creando tu cuenta…";button.disabled=true;try{const result=await PLAYFORJA.register({email:document.getElementById("email").value,password:document.getElementById("password").value,username:document.getElementById("username").value,country_code:document.getElementById("country").value||null});status.textContent=result.session?"¡Cuenta creada! Ya podés iniciar sesión.":"Te enviamos un correo para confirmar tu cuenta. Revisá tu bandeja de entrada y spam.";e.target.reset()}catch(err){status.textContent=err.message||"No se pudo crear la cuenta."}finally{button.disabled=false}});
</script></body></html>
